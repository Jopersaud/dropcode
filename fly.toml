# Fly.io config for the dropcode signaling server + web client.
# Rooms live in memory, so run exactly ONE machine and never auto-stop it
# (stopping it drops every waiting code). See README "Deploying to Fly.io".
app = "dropcode-CHANGE-ME"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  TRUST_PROXY = "fly"   # rate-limit by Fly-Client-IP, not the proxy's address
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 2000
    hard_limit = 5000

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
